name: Windows build and tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore OpsisNewsCrawler.sln
      - name: Build solution
        run: dotnet build OpsisNewsCrawler.sln --configuration Release --no-restore
      - name: Run core tests
        run: dotnet test tests/OpsisNewsCrawler.Core.Tests/OpsisNewsCrawler.Core.Tests.csproj --configuration Release
      - name: Verify release versions
        shell: pwsh
        run: |
          $files = @(
            'src/OpsisNewsCrawler.App/OpsisNewsCrawler.App.csproj',
            'src/OpsisNewsCrawler.Core/OpsisNewsCrawler.Core.csproj',
            'src/OpsisNewsCrawler.Windows/OpsisNewsCrawler.Windows.csproj',
            'src/OpsisNewsCrawler.OpsisPlugin/OpsisNewsCrawler.OpsisPlugin.csproj',
            'src/OpsisNewsCrawler.Plugin.Abstractions/OpsisNewsCrawler.Plugin.Abstractions.csproj'
          )
          $versions = foreach ($file in $files) {
            if ((Get-Content $file -Raw) -notmatch '<Version>([0-9.]+)</Version>') { throw "No <Version> in $file" }
            $Matches[1]
          }
          $expected = $versions[0]
          if (($versions | Select-Object -Unique).Count -ne 1) { throw "Project versions differ: $($versions -join ', ')" }
          if ((Get-Content 'OpsisNewsCrawler.iss' -Raw) -notmatch ('#define MyAppVersion "' + [regex]::Escape($expected) + '"')) { throw "Installer version is not $expected" }
          if ((Get-Content 'src/OpsisNewsCrawler.Windows/AboutTexts.cs' -Raw) -notmatch ('Version = "' + [regex]::Escape($expected) + '"')) { throw "AboutTexts version is not $expected" }
          if ((Get-Content 'CHANGELOG.md' -Raw) -notmatch ('## ' + [regex]::Escape($expected) + ' ')) { throw "CHANGELOG has no entry for $expected" }
          "All versions are $expected"
